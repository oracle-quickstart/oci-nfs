title: "NFS Deployment"
schemaVersion: 1.0.0
version: "20200727"
locale: "en"

groupings:
  - title: "Predefined General Configuration"
    visible: false
    variables:
    - tenancy_ocid
    - compartment_ocid
    - region
    - ssh_user
    - volume_attach_device_mapping
    - volume_type_vpus_per_gb_mapping
    - ad_number
    - mp_listing_id
    - mp_listing_resource_id
    - mp_listing_resource_version
    - use_marketplace_image
    - block_size
    - fs_name
    - fs_type
    - fs_ha
    - instance_os
    - linux_os_version
    - marketplace_source_images
    - scratch_storage_server_shape
    - use_non_uhp_fs1
    - create_monitoring_server
    - monitoring_server_hostname
    - monitoring_server_ocpus
    - monitoring_server_shape
  - title: "General Deployment Configuration"
    visible: true
    variables:
    - ssh_public_key
    - ad_name
    - use_custom_name
    - cluster_name
  - title: "VCN Configuration"
    visible: true
    variables:
    - use_existing_vcn
    - vcn_compartment
    - vcn_cidr
    - vcn_id
    - bastion_subnet_id
    - storage_subnet_id
    - fs_subnet_id
    - bastion_subnet_cidr
    - storage_subnet_cidr
    - fs_subnet_cidr
    - ha_vip_private_ip
    - ha_vip_hostname
  - title: "Bastion Instance Configuration"
    visible: true
    variables:
    - bastion_shape
    - bastion_ocpus
    - bastion_node_count
    - bastion_hostname_prefix
    - bastion_boot_volume_size
  - title: "NFS Server Instance Configuration"
    visible: true
    variables:
    - persistent_storage_server_shape
    - storage_server_ocpus
    - storage_server_custom_memory
    - storage_server_memory
    - storage_server_hostname_prefix
    - storage_server_boot_volume_size
  - title: "NFS Shared Block Storage"
    visible: true
    variables:
    - fs1_disk_perf_tier
    - fs1_disk_count
    - fs1_disk_size
  - title: "Quorum Server Instance Configuration"
    visible: true
    variables:
    - quorum_server_shape
    - quorum_server_ocpus
    - quorum_server_hostname
  - title: "NFSv4 Client Instance Configuration - Optional"
    visible: true
    variables:
    - create_compute_nodes
    - client_node_shape
    - client_node_ocpus
    - client_node_count
    - client_node_hostname_prefix
    - mount_point
  
# Add variable here ,  if you want to do input validation or else it does not need to be included here.
variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    description: "The tenancy where the stack is deployed. Automatically assigned by Marketplace/Resource Manager."
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    description: "The deployment region. Automatically assigned by Marketplace/Resource Manager."
    required: true

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Deployment Compartment"
    description: "The compartment where resources are deployed. Automatically assigned by Marketplace/Resource Manager."
    required: true

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "Public SSH key"
    description: "Public SSH key"
    required: true

  ad_name:
    title: "Availability Domain"
    description: "Availability Domain where filesystem is deployed."
    type: oci:identity:availabilitydomain:name
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: true

  use_custom_name:
    type: boolean
    title: "use custom cluster name"
    description: "Use custom name for cluster resources, especially in display name of resources shown in OCI console"
    required: false
    default: false

  cluster_name:
    title: "Custom Cluster Name"
    description: "Custom cluster name. Example: Display name of storage block volumes will use <custom_cluster_name>_nfs_target1"
    default: "nfs_cluster"
    type: string
    visible:
      and:
        - ${use_custom_name}

  bastion_shape:
    title: "Bastion Compute Shape"
    description: "Shape for bastion instances."
    default: "VM.Standard.E5.Flex"
    required: true
    type: enum
    enum:
    - "VM.DenseIO2.8"
    - "VM.DenseIO2.16"
    - "VM.DenseIO2.24"
    - "VM.Standard.E3.Flex"
    - "VM.Standard.E4.Flex"
    - "VM.Standard.E5.Flex"
    - "BM.Standard.E3.128"
    - "BM.Standard.E4.128"
    - "BM.Standard.E5.128"
    - "BM.DenseIO2.52"
    - "BM.GPU3.8"
    - "BM.GPU4.8"
    - "VM.Optimized3.Flex"
    - "BM.Optimized3.36"
    visible: true

  bastion_ocpus:
    title: Cores
    type: integer
    description: Number of OCPU's for flex shape
    minimum: 1
    maximum: 64
    default: 2
    visible:
      and:
        - or:
          - eq:
            - ${bastion_shape}
            - "VM.Standard.E3.Flex"
          - eq:
            - ${bastion_shape}
            - "VM.Standard.E4.Flex"
          - eq:
            - ${bastion_shape}
            - "VM.Standard.E5.Flex"
    required: true

  bastion_node_count:
    title: "Number of bastion"
    description: "Number of bastion instances."
    type: integer
    default: 1
    minimum: 1
    required: true
    visible: false

  bastion_hostname_prefix:
    type: string
    required: true
    default: "bastion-"
    description: "Bastion hostname prefix "
    visible: true

  bastion_boot_volume_size:
    type: integer
    required: true
    minimum: 50
    title: "Size of the boot volume in GB"
    default: 100

  scratch_storage_server_shape:
    title: "NFS Storage Server Compute Shape"
    description: "Shape for storage server instances. DenseIO shapes come with local NVMe SSDs which will be used for storage."
    default: "BM.DenseIO2.52"
    required: true
    type: enum
    enum:
    - "VM.DenseIO2.8"
    - "VM.DenseIO2.16"
    - "VM.DenseIO2.24"
    - "BM.DenseIO2.52"
    - "BM.HPC2.36"
    - "BM.Optimized3.36"
    visible: false

  persistent_storage_server_shape:
    title: "NFS Storage Server Compute Shape"
    description: "Shape for storage server instances."
    default: "BM.Standard2.52"
    required: true
    type: enum
    enum:
    - "VM.Standard3.Flex"
    - "VM.Standard4.Flex"
    - "VM.Standard4.Ax.Flex"
    - "VM.Standard.E3.Flex"
    - "BM.Standard.E3.128"
    - "BM.Standard3.64"
    - "BM.Standard4.Ax.120"
    - "VM.Standard.E4.Flex"
    - "BM.Standard.E4.128"
    - "VM.Standard.E5.Flex"
    - "BM.Standard.E5.192"
    - "VM.Standard.E6.Flex"
    - "VM.Standard.E6.Ax.Flex"
    - "BM.Standard.E6.256"
    - "BM.Standard.E6.Ax.192"
    - "VM.Optimized3.Flex"
    - "BM.Optimized3.36"
    - "BM.HPC2.36"
    visible: true

  storage_server_ocpus:
    title: Cores
    type: integer
    description: Number of OCPU's for flex shape
    minimum: 1
    maximum: 64
    default: 2
    visible:
      and:
        - or:
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E3.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E4.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E5.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E6.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E6.Ax.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard3.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard4.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard4.Ax.Flex"
    required: true


  storage_server_custom_memory:
    title: Use custom memory size
    type: boolean
    default: false
    visible:
      and:
        - or:
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E3.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E4.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E5.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E6.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E6.Ax.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard3.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard4.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard4.Ax.Flex"
    

  storage_server_memory:
    title: Memory in GBS
    type: integer
    description: Number of memory for flex shape. Minimum 1GB per core.
    minimum: 1
    maximum: 1024
    default: 16
    visible:
      and:
        - or:
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E3.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E4.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E5.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E6.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard.E6.Ax.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard3.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard4.Flex"
          - eq:
            - ${persistent_storage_server_shape}
            - "VM.Standard4.Ax.Flex"
        - and:
            - ${storage_server_custom_memory}
    required: true
  storage_server_hostname_prefix:
    type: string
    required: true
    default: "nfs-server-"
    description: "Storage server hostname prefix "
    visible: true

  storage_server_boot_volume_size:
    type: integer
    required: true
    minimum: 50
    title: "Size of the boot volume in GB. Recommend using 200-300 GB in production to ensure there is enough space for logs."
    default: 300



  use_non_uhp_fs1:
    type: boolean
    title: "XFS-1 : Build file system using either Higher/Balanced/Lower Cost Performance Block Volumes"
    description: "Create XFS-1 file system. Multiple XFS filesystems are supported.  All XFS will be exported over NFS"
    required: false
    default: true
    visible: false



  fs1_disk_perf_tier:
    title: "Block Volume Storage Performance tier"
    description: "Select block volume storage performance tier based on your performance needs. See https://docs.cloud.oracle.com/en-us/iaas/Content/Block/Concepts/blockvolumeelasticperformance.htm for more information."
    type: enum
    enum:
    - "Higher Performance"
    - "Balanced"
    - "Lower Cost"
    required: true
    default: "Higher Performance"
    visible: true

  fs1_disk_count:
    title: "Number of block volumes"
    description: "Number of block volume disk per file server. Each attached as JBOD (no RAID). Block Volumes are durable and highly available(HA)."
    type: integer
    default: 8
    minimum: 1
    maximum: 32
    required: true
    visible: true



  fs1_disk_size:
    title: "Block volume size"
    description: "Select size in GB for each block volume/disk, min 50."
    type: integer
    default: 1000
    minimum: 50
    maximum: 32768
    required: true
    visible: true

  create_compute_nodes:
    type: boolean
    title: "Create Compute Nodes"
    description: "Select checkbox, if you want to create compute nodes to mount the filesystem"
    required: false
    default: false

  client_node_shape:
    title: "Client Compute Shape"
    description: "Shape for client instances."
    default: "VM.Standard.E5.Flex"
    required: true
    visible: ${create_compute_nodes}
    type: enum
    enum:
    - "VM.Standard.E3.Flex"
    - "VM.Standard.E4.Flex"
    - "VM.Standard.E5.Flex"
    - "BM.Standard.E3.128"
    - "BM.Standard.E4.128"
    - "BM.DenseIO2.52"
    - "BM.HPC2.36"
    - "BM.GPU3.8"
    - "BM.GPU4.8"
    - "VM.Optimized3.Flex"
    - "BM.Optimized3.36"

  client_node_ocpus:
    title: Cores
    type: integer
    description: Number of OCPU's for flex shape
    minimum: 1
    maximum: 64
    default: 2
    visible:
      and:
        - or:
          - eq:
            - ${client_node_shape}
            - "VM.Standard.E3.Flex"
          - eq:
            - ${client_node_shape}
            - "VM.Standard.E4.Flex"
          - eq:
            - ${client_node_shape}
            - "VM.Standard.E5.Flex"
    required: true

  client_node_count:
    title: "Number of clients"
    description: "Number of client instances."
    type: integer
    default: 1
    visible: ${create_compute_nodes}
    required: true

  client_node_hostname_prefix:
    title: "Client Node Hostname Prefix"
    type: string
    required: true
    default: "client-"
    description: "Client hostname prefix "
    visible: ${create_compute_nodes}

  fs_name:
    title: "Filesystem Name"
    type: enum
    enum:
    - "NFS"
    required: true
    default: "NFS"
    description: "Select filesystem to deploy."
    visible: false

  fs_type:
    title: "Filesystem Type"
    type: enum
    enum:
    - "Scratch"
    - "Persistent"
    required: true
    default: "Persistent"
    description: "Persistent shared block-volume storage used by the active/passive HA NFS cluster."
    visible: false

  fs_ha:
    type: boolean
    title: "Active/Passive Highly Available"
    description: "Deploy a two-node active/passive highly available NFS cluster."
    required: true
    default: true
    visible: false

  mount_point:
    title: "Filesystem Mount Point"
    type: string
    required: true
    default: "/mnt/nfs"
    description: "Root directory where enabled NFSv4 exports are mounted on client instances."
    visible: ${create_compute_nodes}

  ad_number:
    description: "Shadowed TF value to ignore"
    type: integer
    required: true
    default: -1

  ssh_user:
    type: string
    required: true
    default: "opc"
    description: "opc for OracleLinux & CentOS, ubuntu for Ubuntu OS."

  mp_listing_id:
    type: string
    required: true
    description: "Marketplace Listing ID"

  mp_listing_resource_id:
    type: oci:core:image:id
    required: true
    description: "Marketplace Image OCID"
    dependsOn:
      compartmentId: ${compartment_ocid}

  mp_listing_resource_version:
    type: string
    required: true
    description: "Marketplace Listing package version"

  use_existing_vcn:
    type: boolean
    title: "Use Existing VCN"
    description: "Select checkbox, to use existing VCN, otherwise new VCN, subnets and related resources will be created"
    required: true
    default: false

  vcn_cidr:
    title: "VCN CIDR"
    description: "VCN IP Range/Network CIDR to use for VCN."
    type: string
    default: "10.0.0.0/16"
    required: true
    visible:
      not:
        - ${use_existing_vcn}

  vcn_compartment:
    title: "VCN compartment"
    type: oci:identity:compartment:id
    visible: ${use_existing_vcn}
    default: ${targetCompartment}
    required: true

  vcn_id:
    type: oci:core:vcn:id
    visible:
      and:
        - ${use_existing_vcn}
    title: "Existing network"
    default: ''
    required: true
    dependsOn:
      compartmentId: ${vcn_compartment}

  bastion_subnet_id:
    type: oci:core:subnet:id
    title: "Bastion Subnet OCID"
    description: "Bastion Subnet - Ensure the Subnet is in the same availability domain selected above or use regional subnet"
    dependsOn:
      compartmentId: ${vcn_compartment}
      vcnId: ${vcn_id}
      hidePrivateSubnet: false
    visible: ${use_existing_vcn}  
    required: true

  storage_subnet_id:
    type: oci:core:subnet:id
    title: "NFS Server Primary Subnet OCID"
    description: "Enter private subnet OCID to be used to deploy NFS servers. This will be the primary subnet used by the server to access boot/OS disk and network attached data Block Volumes. Ensure the Subnet is in the same availability domain selected above or use regional subnet.  Refer to architecture diagrams here: https://github.com/oracle-quickstart/oci-nfs."
    dependsOn:
      compartmentId: ${vcn_compartment}
      vcnId: ${vcn_id}
      hidePublicSubnet: true
    visible: ${use_existing_vcn}
    required: true

  fs_subnet_id:
    type: oci:core:subnet:id
    title: "NFS Server Secondary Subnet OCID"
    description: "Only set this value, if you plan to use Bare metal compute shapes (except BM.HPC2.36) for NFS file servers. Otherwise leave it blank. This 2nd private subnet OCID will be used to create a secondary VNIC using 2nd physical NIC.  For Baremetal nodes(except BM.HPC2.36), we need two subnets to use both physical NICs of the node for highest performance. Refer to architecture diagrams here: https://github.com/oracle-quickstart/oci-nfs."
    dependsOn:
      compartmentId: ${vcn_compartment}
      vcnId: ${vcn_id}
      hidePublicSubnet: true
    visible: ${use_existing_vcn}
    required: true

  ha_vip_private_ip:
    type: string
    title: "Private Virtual IP for HA (Highly Availability)"
    description: "Optional fixed address for the floating HA VIP. Leave blank to let OCI allocate a valid address in the selected VIP subnet."
    required: false
    visible: ${fs_ha}

  ha_vip_hostname:
    type: string
    title: "Hostname for Private Virtual IP for HA (Highly Availability)"
    description: "Must be unique within the subnet it belongs to. Example: nfs-vip-123."
    required: optional
    default: "nfs-vip-1"
    visible: true


  quorum_server_shape:
    title: "Quorum Server Compute Shape"
    description: "Shape for Quorum node. A minimum of 3 nodes (2 NFS Server node + 1 Quorum node) are required to ensure that a cluster always has a quorum of nodes to maintain a healthy active cluster."
    default: "VM.Standard.E5.Flex"
    required: true
    type: enum
    enum:
    - "VM.Standard.E3.Flex"
    - "VM.Standard.E4.Flex"
    - "VM.Standard.E5.Flex"
    - "VM.GPU3.1"
    - "VM.GPU3.2"
    - "VM.GPU3.4"
    - "BM.Standard.E3.128"
    - "BM.Standard.E4.128"
    - "BM.DenseIO2.52"
    - "BM.HPC2.36"
    - "BM.GPU3.8"
    - "BM.GPU4.8"
    - "VM.Optimized3.Flex"
    - "BM.Optimized3.36"

  quorum_server_ocpus:
    title: Cores
    type: integer
    description: Number of OCPU's for flex shape
    minimum: 1
    maximum: 64
    default: 2
    visible:
      and:
        - or:
          - eq:
            - ${quorum_server_shape}
            - "VM.Standard.E3.Flex"
          - eq:
            - ${quorum_server_shape}
            - "VM.Standard.E4.Flex"
          - eq:
            - ${quorum_server_shape}
            - "VM.Standard.E5.Flex"
    required: true

  quorum_server_hostname:
    title: "Quorum Server Hostname"
    type: string
    required: true
    default: "qdevice"
    description: "Quorum node hostname"
    visible: true

  instance_os:
    title: "Operating system for compute instances"
    type: string
    default: "Oracle Linux"
    visible: false

  linux_os_version:
    title: "Operating system version for compute instances"
    type: string
    default: "8.10"
    visible: false


  bastion_subnet_cidr:
    type: string
    title: "Bastion Subnet CIDR"
    description: "Subnet IP Range/CIDR to use for regional public subnet. Example: 10.0.0.0/24.  Must be within VCN subnet."
    default: "10.0.0.0/24"
    visible:
      not:
        - ${use_existing_vcn}
    required: true

  storage_subnet_cidr:
    type: string
    title: "NFS Server Primary Subnet CIDR"
    description: "Subnet IP Range/CIDR to use for regional private subnet. This will be the primary subnet used by  NFS file servers & Quorum node to access boot/OS disk and network attached data Block Volumes. Example: 10.0.3.0/24. Must be within VCN subnet."
    default: "10.0.3.0/24"
    visible:
      not:
        - ${use_existing_vcn}
    required: true

  fs_subnet_cidr:
    type: string
    title: "NFS Server Secondary Subnet CIDR"
    description: "Only set this value, if you plan to use Bare metal compute shapes (except BM.HPC2.36) for NFS file servers. This 2nd private regional subnet will be used to create a secondary VNIC on file servers using 2nd physical NIC to achieve highest performance. Example: 10.0.6.0/24. Must be within VCN subnet."
    default: "10.0.6.0/24"
    visible:
      not:
        - ${use_existing_vcn}
    required: false
